spring:
  application:
    name: TicketZone

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:mem:ticketzone;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    defer-datasource-initialization: true   # Hibernate 테이블 생성 후 data.sql 실행
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${ACCESS_EXPIRATION:3600000}     # 1시간
    refresh-token-expiration: ${REFRESH_EXPIRATION:604800000} # 7일
